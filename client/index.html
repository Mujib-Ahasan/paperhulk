<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperHulk</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&display=swap" rel="stylesheet"/>
</head>
<body>
 <main class="page">
  <section class="hero">

    <h1>PaperHulk</h1>
    <form id="summary-form">

     <label for="pdf-file" class="folder-wrapper">
     <img
      src="./../assets/folder.png"
      alt="Folder"
      class="folder-image"
      />
    </label>

     <input
      type="file"
      id="pdf-file"
      accept="application/pdf"
      hidden
      required
     />

     <p id="selected-file"></p>

     <div id="summary-options" class="hidden">

    <div class="mode-cards">
      <button type="button" class="mode-card active" data-mode="normal">
      <span>Normal Summary</span>
      <small>Structured technical summary</small>
    </button>

  <button type="button" class="mode-card" data-mode="eli10">
    <span>Explain Like I'm 10</span>
    <small>Simple child-friendly explanation</small>
  </button>
</div>

<input type="hidden" id="mode" value="normal" />

<div id="provider-options" class="hidden">
  <div class="provider-cards">
    <button type="button" class="provider-card active" data-provider="ollama">
      <span>🦙 Ollama</span>
      <small>Run locally on your machine</small>
    </button>

    <button type="button" class="provider-card" data-provider="gemini">
      <span>✨ Gemini</span>
      <small>Use Google Gemini API</small>
    </button>
  </div>
</div>

<input type="hidden" id="provider" value="ollama" />

<button type="submit" class="summarize-btn">
  Summarize Paper
</button>


    </div>
    </form>

    <p id="status"></p>
    <div id="progress-wrapper" class="hidden">
      <p id="progress-text">Preparing...</p>
      <div class="progress-track">
    <div id="progress-bar"></div>
    </div>

    <button
    id="cancel-button"
    class="cancel-btn hidden"
    type="button">
    Cancel Summarization
  </button>
   </div>

  </section>

  <section class="result-card hidden" id="result-card">
    <div id="metadata"></div>

    <h2>Summary</h2>

    <pre id="summary-output"></pre>
    <div class="save-actions hidden" id="save-actions">
  <select id="save-format">
    <option value="md">Markdown (.md)</option>
    <option value="txt">Text (.txt)</option>
    <option value="pdf">PDF (.pdf)</option>
  </select>
    <button id="save-summary" class="save-button">Save Summary</button>
    <button id="share-summary" class="share-button" type="button">Share Summary</button>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
