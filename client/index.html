<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperHulk</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&display=swap" rel="stylesheet"/>
</head>
<body>
 <main class="page">
  <section class="hero">

    <h1>PaperHulk</h1>
    <form id="summary-form">

     <label for="pdf-file" class="folder-wrapper">
     <img
      src="./../assets/folder.png"
      alt="Folder"
      class="folder-image"
      />
    </label>

     <input
      type="file"
      id="pdf-file"
      accept="application/pdf"
      hidden
      required
     />

     <p id="selected-file"></p>

     <div id="summary-options" class="hidden">

     <select id="mode">
       <option value="normal">Normal Summary</option>
       <option value="eli10">Explain Like I'm 10</option>
     </select>

    <button type="submit">
    Summarize Paper
    </button>

    </div>
    </form>

    <p id="status"></p>

  </section>

  <section class="result-card hidden" id="result-card">
    <div id="metadata"></div>

    <h2>Summary</h2>

    <pre id="summary-output"></pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
